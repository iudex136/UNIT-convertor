<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>unit convertor</title>
</head>
<body>
    <h1>unit convertor by IUDEX</h1>
    <div id="main">
        <div id="upper">
            <input type="number" id="inputEl" max="5">
            <p id="resultEl"></p>
            <button id="convertbtn"> Convert</button>
            <button id="revers">metric to US</button>
        </div>
        <div id="units">
            <button id="1" class="unitchoice">Meter/feet</button>
            <button id="2" class="unitchoice">kilogram/pound</button>
            <button id="3" class="unitchoice">Liter/Galon</button>

        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
